{% extends 'base.html' %}

{% block title %}Catat Transaksi - Inventaris JOB Tomori{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0">
            <div class="card-body">
                <h4 class="card-title mb-4 fw-bold text-dark">Catat Transaksi Barang</h4>
                
                <div class="alert alert-light border mb-4">
                    <strong>{{ barang.kode_barang }}</strong> - {{ barang.nama_barang }} <br>
                    Stok Saat Ini: <span class="badge bg-secondary">{{ barang.stok }} {{ barang.satuan }}</span>
                </div>

                <form action="{{ url_for('catat_transaksi', id=barang.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Jenis Transaksi</label>
                        <select class="form-select" name="jenis" required>
                            <option value="Masuk">Barang Masuk (Restock)</option>
                            <option value="Keluar">Barang Keluar (Distribusi)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Jumlah ({{ barang.satuan }})</label>
                        <input type="number" class="form-control" name="jumlah" min="1" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Keterangan / Referensi</label>
                        <input type="text" class="form-control" name="keterangan" placeholder="Contoh: PO-2026-09, Diambil Divisi HR" required>
                    </div>
                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Simpan Transaksi</button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
