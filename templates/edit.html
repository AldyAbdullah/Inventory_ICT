{% extends 'base.html' %}

{% block title %}Edit Barang - Inventaris JOB Tomori{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Edit Data Barang IT</h3>
                
                <form action="{{ url_for('edit', id=barang.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Kode Barang</label>
                        <input type="text" class="form-control" name="kode_barang" value="{{ barang.kode_barang }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nama Barang</label>
                        <input type="text" class="form-control" name="nama_barang" value="{{ barang.nama_barang }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Kategori</label>
                        <select class="form-select" name="kategori">
                            <option value="Tinta Printer" {% if barang.kategori == 'Tinta Printer' %}selected{% endif %}>Tinta Printer</option>
                            <option value="Jaringan" {% if barang.kategori == 'Jaringan' %}selected{% endif %}>Jaringan</option>
                            <option value="Peripheral" {% if barang.kategori == 'Peripheral' %}selected{% endif %}>Peripheral (Mouse/Keyboard)</option>
                            <option value="Power/Listrik" {% if barang.kategori == 'Power/Listrik' %}selected{% endif %}>Power/Listrik</option>
                            <option value="Lainnya" {% if barang.kategori == 'Lainnya' %}selected{% endif %}>Lainnya</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Stok</label>
                            <input type="number" class="form-control" name="stok" value="{{ barang.stok }}" min="0" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Satuan</label>
                            <input type="text" class="form-control" name="satuan" value="{{ barang.satuan }}" required>
                        </div>
                    </div>
                    <hr>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Update Data</button>
                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
