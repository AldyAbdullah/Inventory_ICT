<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak QR Massal - JOB Tomori</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; }
        .print-container { max-width: 210mm; margin: 0 auto; padding: 20px; background: white; }
        .qr-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .qr-card { border: 1px dashed #ccc; padding: 10px; text-align: center; border-radius: 8px; }
        .qr-card img { max-width: 100%; height: auto; }
        .qr-title { font-size: 0.75rem; font-weight: bold; margin-top: 5px; line-height: 1.2; }
        .qr-code { font-size: 0.7rem; color: #555; }
        
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .no-print { display: none !important; }
            .print-container { padding: 0; width: 100%; max-width: none; box-shadow: none; }
            .qr-card { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="container mt-3 mb-3 no-print d-flex justify-content-between">
        <a href="{{ url_for('master_barang') }}" class="btn btn-secondary">Kembali</a>
        <button onclick="window.print()" class="btn btn-primary">Cetak Sekarang (Ctrl+P)</button>
    </div>

    <div class="print-container">
        <div class="qr-grid">
            {% for item in qr_data_list %}
            <div class="qr-card">
                <img src="data:image/png;base64,{{ item.qr_image }}" alt="QR Code">
                <div class="qr-title">{{ item.barang.nama_barang }}</div>
                <div class="qr-code">{{ item.barang.kode_barang }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
