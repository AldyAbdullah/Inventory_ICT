<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inventaris JOB Tomori</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0A2540; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-login { width: 100%; max-width: 400px; border: none; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .btn-primary { background-color: #004B87; border-color: #004B87; }
        .btn-primary:hover { background-color: #0A2540; border-color: #0A2540; }
    </style>
</head>
<body>
    <div class="card card-login p-4">
        <div class="card-body">
            <div class="text-center mb-4">
                <i class="bi bi-box-seam-fill fs-1" style="color: #004B87;"></i>
                <h4 class="fw-bold mt-2 text-dark">Inventaris Tomori</h4>
                <p class="text-muted small">Silakan login untuk mengakses sistem</p>
            </div>

            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-medium small">Username</label>
                    <input type="text" class="form-control" name="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium small">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">Masuk Sistem</button>
            </form>
        </div>
    </div>
</body>
</html>
