<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label QR - {{ barang.nama_barang }}</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
        .label-container { border: 1px solid #000; display: inline-block; padding: 15px; border-radius: 8px; width: 220px; }
        .qr-image { width: 150px; height: 150px; margin-bottom: 10px; }
        .kode { font-weight: bold; font-size: 16px; margin: 0; }
        .nama { font-size: 13px; color: #333; margin-top: 5px; word-wrap: break-word; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body onload="window.print()">
    <div class="label-container">
        <h4 style="margin: 0 0 10px 0; font-size: 14px;">JOB TOMORI</h4>
        <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code" class="qr-image">
        <p class="kode">{{ barang.kode_barang }}</p>
        <p class="nama">{{ barang.nama_barang }}</p>
    </div>
    <br><br>
    <button class="no-print" onclick="window.close()" style="padding: 8px 16px; cursor: pointer;">Tutup</button>
</body>
</html>
